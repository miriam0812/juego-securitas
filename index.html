
<!DOCTYPE html>
<html lang='es'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Ruleta Numérica · Teleclose</title>
  <link rel='stylesheet' href='style.css'>
</head>
<body>
<header class='topbar'>
  <h1>🎯 Ruleta de Objeciones · <span class='brand'>Teleclose</span> · Números</h1>
  <p class='subtitle'>Ruleta visual limpia · Objeciones completas al abrir tarjeta</p>
</header>
<main class='layout'>
  <section class='wheel-wrap'>
    <div class='pointer'>▲</div>
    <canvas id='wheel' width='560' height='560'></canvas>
    <button id='spinBtn' class='primary'>Girar</button>
  </section>
  <section class='panel'>
    <h2>Objeciones (clic para ver)</h2>
    <ol id='legend' class='legend'></ol>
  </section>
</main>
<dialog id='card'>
  <article>
    <header><h3 id='cardTitle'></h3></header>
    <div id='cardBody'></div>
    <footer class='card-actions'>
      <button id='closeCard' class='secondary'>Volver</button>
      <button id='spinAgain' class='primary'>Girar de nuevo</button>
    </footer>
  </article>
</dialog>
<script src='script.js'></script>
</body></html>
